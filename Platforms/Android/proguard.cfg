# Keep Google API model classes and Gson/Json reflection targets
-keep class com.google.api.** { *; }
-keep class com.google.gson.** { *; }

# --- AndroidX Security Crypto + Tink (backs EncryptedSharedPreferences) ---
# These use reflection / JNI lookups by original name, so they must not be
# renamed, shrunk, or have enum fields (e.g. AES256_SIV) removed.
-keep class androidx.security.crypto.** { *; }
-keep class com.google.crypto.tink.** { *; }
-keepclassmembers class androidx.security.crypto.** { *; }
-keepclassmembers enum androidx.security.crypto.** { *; }

# Keep all enum values() / valueOf() generally (protects enum-by-name lookups)
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# Keep annotations used at runtime
-keepattributes *Annotation*, Signature, InnerClasses, EnclosingMethod